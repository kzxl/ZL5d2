[build]
target = "armv5te-none-eabi"
rustflags = [
    "-C", "target-cpu=arm946e-s",
    "-C", "target-feature=+strict-align",
    "-C", "relocation-model=static",
    "-C", "panic=abort",
    "-C", "opt-level=z",
]

[unstable]
build-std = ["core", "compiler_builtins"]  # no "alloc": zero-heap policy, no global allocator
build-std-features = ["compiler-builtins-mem", "panic-immediate-abort"]
