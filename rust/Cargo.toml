[workspace]
resolver = "2"
members = [
    "crates/zero-d4-sys",
    "crates/zero-d4",
    "crates/zero-photo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Phong Vo <phong.vo@zerouniverse.io>", "ZeroUniverse Team"]
license = "GPL-2.0-only OR MIT"
repository = "https://github.com/kzxl/ZeroLantern5D2"
categories = ["embedded", "no-std", "hardware-support"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false
strip = true
debug = false
